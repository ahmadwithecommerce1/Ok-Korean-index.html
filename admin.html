<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - OK Korean</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           PREMIUM ADMIN PANEL DESIGN
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%); 
            color: #e2e8f0; 
            padding: 3rem 1rem; 
            min-height: 100vh;
        }

        .admin-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .page-header h1 {
            font-size: 2rem;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            letter-spacing: 1px;
        }
        .page-header p {
            color: #64748b;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .admin-box { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        h2 { 
            font-size: 1.25rem; 
            margin-bottom: 1.5rem; 
            color: #f8fafc; 
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 1rem; 
        }

        .form-group { 
            margin-bottom: 1.25rem; 
        }
        label { 
            display: block; 
            font-weight: 500; 
            margin-bottom: 0.5rem; 
            font-size: 0.85rem; 
            color: #94a3b8; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: #f8fafc; 
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 1rem; 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            cursor: pointer; 
            font-weight: 600; 
            letter-spacing: 0.5px;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        button:hover { 
            background: linear-gradient(135deg, #f87171, #dc2626); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        
        .btn-green { 
            background: linear-gradient(135deg, #10b981, #059669); 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-green:hover { 
            background: linear-gradient(135deg, #34d399, #10b981); 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .success { 
            color: #10b981; 
            text-align: center; 
            margin-top: 1rem; 
            font-weight: 600;
            display: none; 
            background: rgba(16, 185, 129, 0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .list-item { 
            background: #0f172a; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 4px solid #38bdf8; 
            border-top: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item span {
            font-weight: 500;
            color: #cbd5e1;
        }
        .list-item button { 
            width: auto; 
            padding: 6px 14px; 
            margin: 0; 
            background: #ef4444; 
            font-size: 0.8rem; 
            box-shadow: none;
        }
        .list-item button:hover {
            background: #dc2626;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        
        <div class="page-header">
            <h1>Control Room</h1>
            <p>Manage your dashboard data seamlessly.</p>
        </div>

        <!-- SECTION 1: EDIT EXISTING ROWS -->
        <div class="admin-box">
            <h2>✏️ Edit Existing Rows</h2>
            
            <div class="form-group">
                <label>OEC Balloting Applicants</label>
                <input type="text" id="edit-oec-app" placeholder="e.g. 0000">
            </div>
            <div class="form-group">
                <label>OEC Status (ACTIVE / NON-ACTIVE)</label>
                <input type="text" id="edit-oec-status" placeholder="e.g. NON-ACTIVE">
            </div>

            <div class="form-group">
                <label>Skill Test Applicants</label>
                <input type="text" id="edit-skill-app" placeholder="e.g. Pending">
            </div>
            <div class="form-group">
                <label>Skill Test Program</label>
                <input type="text" id="edit-skill-dest" placeholder="e.g. SKILL TEST PREP">
            </div>

            <div class="form-group">
                <label>EPS Topik Applicants</label>
                <input type="text" id="edit-eps-app" placeholder="e.g. 0450">
            </div>

            <div class="form-group">
                <label>EPS Merit</label>
                <input type="text" id="edit-merit" placeholder="e.g. 82.5">
            </div>
            <div class="form-group">
                <label>EPS Total Passers</label>
                <input type="text" id="edit-passers" placeholder="e.g. 590">
            </div>

            <button class="btn-green" onclick="updateExistingRows()">Update Existing Rows</button>
            <p class="success" id="msg1">✅ Existing Rows Updated Successfully!</p>
        </div>

        <!-- SECTION 2: ADD NEW ROWS -->
        <div class="admin-box">
            <h2>➕ Add New Row</h2>
            
            <div class="form-group">
                <label>Signal Color Animation</label>
                <select id="input-signal">
                    <option value="red-glow">🔴 Red Light (Blink)</option>
                    <!-- Naya Option Yahan Add Kiya Hai -->
                    <option value="both-red-glow">🔴🔴 Both Red (Blink)</option>
                    
                    <option value="green-glow">🟢 Green Light (Blink)</option>
                    <option value="both-green-glow">🟢🟢 Both Green (Blink)</option>
                    <option value="led-fade-both">🟢 Both Green (Fade In/Out)</option>
                    <option value="led-alternate-red-green">🔴🟢 Red + Green (Alternate)</option>
                    <option value="off">⚫ Off (Both Off)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Applicants (Number/Text)</label>
                <input type="text" id="input-applicants" placeholder="e.g. 1234">
            </div>

            <div class="form-group">
                <label>Program / Destination</label>
                <input type="text" id="input-program" placeholder="e.g. MEDICAL TEST">
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="input-status">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="NON-ACTIVE">NON-ACTIVE</option>
                </select>
            </div>

            <button onclick="addNewRow()">Add New Row to Dashboard</button>
            <p class="success" id="msg2">✅ New Row Added Successfully!</p>
        </div>

        <!-- SECTION 3: DELETE NEW ROWS -->
        <div class="admin-box">
            <h2>🗑️ Manage Custom Rows</h2>
            <div id="rows-list">
                <!-- Yahan nayi rows ki list aayegi -->
            </div>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOflQBHU_zmXZmgayqiGM4zokzJaTsqOo",
            authDomain: "ok-web-dashboared.firebaseapp.com",
            databaseURL: "https://ok-web-dashboared-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ok-web-dashboared",
            storageBucket: "ok-web-dashboared.firebasestorage.app",
            messagingSenderId: "926104626658",
            appId: "1:926104626658:web:0b33a91fd31f06c146c5bb",
            measurementId: "G-VKPQ5CHB5G"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.addEventListener('DOMContentLoaded', () => {
            database.ref('dashboard').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if(document.getElementById('edit-oec-app')) document.getElementById('edit-oec-app').value = data.oec_app || '';
                    if(document.getElementById('edit-oec-status')) document.getElementById('edit-oec-status').value = data.oec_status || '';
                    if(document.getElementById('edit-skill-app')) document.getElementById('edit-skill-app').value = data.skill_app || '';
                    if(document.getElementById('edit-skill-dest')) document.getElementById('edit-skill-dest').value = data.skill_dest || '';
                    if(document.getElementById('edit-eps-app')) document.getElementById('edit-eps-app').value = data.eps_app || '';
                    if(document.getElementById('edit-merit')) document.getElementById('edit-merit').value = data.merit || '';
                    if(document.getElementById('edit-passers')) document.getElementById('edit-passers').value = data.passers || '';
                }
            });

            database.ref('new_rows').on('value', (snapshot) => {
                const rowsList = document.getElementById('rows-list');
                rowsList.innerHTML = ''; 
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach((key) => {
                        const row = data[key];
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.innerHTML = `
                            <span>${row.applicants} &rarr; ${row.program}</span>
                            <button onclick="deleteRow('${key}')">Delete</button>
                        `;
                        rowsList.appendChild(div);
                    });
                } else {
                    rowsList.innerHTML = '<p style="text-align:center; color:#64748b; font-size: 0.9rem;">No custom rows added yet.</p>';
                }
            });
        });

        function updateExistingRows() {
            const updatedData = {
                oec_app: document.getElementById('edit-oec-app').value,
                oec_status: document.getElementById('edit-oec-status').value,
                skill_app: document.getElementById('edit-skill-app').value,
                skill_dest: document.getElementById('edit-skill-dest').value,
                eps_app: document.getElementById('edit-eps-app').value,
                merit: document.getElementById('edit-merit').value,
                passers: document.getElementById('edit-passers').value
            };

            database.ref('dashboard').update(updatedData)
                .then(() => {
                    const msg = document.getElementById('msg1');
                    msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; }, 3000);
                }).catch((error) => alert("Error: " + error.message));
        }

        function addNewRow() {
            const signal = document.getElementById('input-signal').value;
            const applicants = document.getElementById('input-applicants').value;
            const program = document.getElementById('input-program').value;
            const status = document.getElementById('input-status').value;

            if(!applicants || !program) {
                alert("Please enter both Applicants and Program details!");
                return;
            }

            database.ref('new_rows').push({
                signal: signal,
                applicants: applicants,
                program: program,
                status: status
            }).then(() => {
                const msg = document.getElementById('msg2');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
                document.getElementById('input-applicants').value = '';
                document.getElementById('input-program').value = '';
            }).catch((error) => alert("Error: " + error.message));
        }

        function deleteRow(key) {
            if(confirm("Are you sure you want to delete this row?")) {
                database.ref('new_rows/' + key).remove();
            }
        }
    </script>
</body>
</html>
